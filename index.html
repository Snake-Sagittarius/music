<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>AI-Generated Music</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 1.5rem 2rem;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            text-align: center;
        }

        header h1 {
            font-size: 1.6rem;
            color: var(--accent-color);
            letter-spacing: 0.05em;
        }

        .main-container {
            display: flex;
            flex: 1;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            padding: 1.5rem;
            gap: 1.5rem;
        }

        /* サイドバー（目次） */
        .sidebar {
            width: 280px;
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 1rem;
            border: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .sidebar h2 {
            font-size: 1rem;
            margin-bottom: 1rem;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
        }

        .track-nav {
            list-style: none;
        }

        .track-nav li {
            margin-bottom: 0.5rem;
        }

        .track-nav li button {
            width: 100%;
            text-align: left;
            padding: 0.75rem 1rem;
            background: none;
            border: 1px solid transparent;
            color: var(--text-color);
            font-size: 0.95rem;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .track-nav li button:hover {
            background-color: rgba(56, 189, 248, 0.1);
            color: var(--accent-color);
        }

        .track-nav li button.active {
            background-color: var(--accent-color);
            color: #0f172a;
            font-weight: bold;
        }

        /* メインコンテンツ表示領域 */
        .content-area {
            flex: 1;
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 2rem;
            border: 1px solid var(--border-color);
        }

        .track-panel {
            display: none;
        }

        .track-panel.active {
            display: block;
        }

        .track-title {
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
            color: var(--accent-color);
        }

        /* プレイヤーエリア */
        .player-container {
            margin-bottom: 2rem;
            background: rgba(0, 0, 0, 0.25);
            padding: 1.25rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        /* VTT編集モードコントロール */
        .edit-toggle-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.75rem;
            padding: 0.5rem 0.75rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .edit-toggle-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            font-size: 0.9rem;
            color: var(--accent-color);
            font-weight: bold;
            user-select: none;
        }

        .edit-toggle-label input {
            cursor: pointer;
            width: 16px;
            height: 16px;
        }

        /* 再生時間リアルタイム表示エリア */
        .time-display {
            font-family: Consolas, Monaco, monospace;
            font-size: 0.95rem;
            color: var(--accent-color);
            font-weight: bold;
            background: rgba(0, 0, 0, 0.4);
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            display: none; /* 初期状態は非表示 */
        }

        .player-editor-wrapper {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .player-editor-wrapper.edit-mode {
            flex-direction: row;
            align-items: stretch;
            flex-wrap: wrap;
        }

        .player-editor-wrapper.edit-mode .video-wrapper {
            flex: 1 1 calc(55% - 0.5rem);
            min-width: 0;
        }

        .vtt-editor-panel {
            display: none;
            flex: 1 1 calc(45% - 0.5rem);
            min-width: 280px;
            flex-direction: column;
            gap: 0.5rem;
            background: rgba(0, 0, 0, 0.3);
            padding: 0.75rem;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .player-editor-wrapper.edit-mode .vtt-editor-panel {
            display: flex;
        }

        .editor-toolbar {
            display: flex;
            gap: 0.5rem;
            justify-content: flex-end;
        }

        .editor-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 0.35rem 0.75rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s ease;
        }

        .editor-btn:hover {
            background: var(--accent-color);
            color: #0f172a;
            font-weight: bold;
        }

        .vtt-textarea {
            width: 100%;
            flex: 1;
            min-height: 250px;
            background: #0f172a;
            color: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 0.6rem;
            font-family: Consolas, Monaco, monospace;
            font-size: 0.85rem;
            line-height: 20px; /* 自動スクロール位置計算用に固定 */
            resize: vertical;
            white-space: pre;
            outline: none;
        }

        .vtt-textarea:focus {
            border-color: var(--accent-color);
        }

        audio, video {
            width: 100%;
            border-radius: 4px;
            outline: none;
            display: block;
        }

        /* 歌詞セクション */
        .lyrics-section h3 {
            font-size: 1.1rem;
            margin-bottom: 1rem;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
        }

        .lyrics-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
        }

        .lyrics-box {
            background: rgba(0, 0, 0, 0.15);
            padding: 1.25rem;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            font-size: 0.95rem;
            line-height: 1.8;
            width: calc(50% - 0.75rem);
            min-width: 300px;
            overflow: auto;
            resize: horizontal;
        }

        .lyrics-text {
            white-space: pre-wrap;
        }

        .lyrics-box h4 {
            font-size: 0.85rem;
            color: var(--accent-color);
            margin-bottom: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .loading, .error {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
        }

        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
            }
            .lyrics-grid {
                grid-template-columns: 1fr;
            }
            .player-editor-wrapper.edit-mode {
                flex-direction: column;
            }
        }

        /* 動画と字幕オーバーレイを包む枠 */
        .video-wrapper {
            position: relative;
            width: 100%;
            border-radius: 4px;
            overflow: hidden;
            background: #000;
        }

        /* 動画の上に被せる全画面字幕エリア */
        .subtitle-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.3);
            opacity: 0;
            transition: opacity 0.6s ease;
            user-select: none;
            touch-action: none;
        }

        .subtitle-overlay.visible {
            opacity: 1;
        }

        /* 編集モード時のオーバーレイ（下部20%を空けてプレイヤー操作を可能にする） */
        .subtitle-overlay.edit-mode-active {
            pointer-events: auto;
            height: 80%; /* 修正: 下部20%を解放してコントロール操作を可能に */
            cursor: grab;
        }

        .subtitle-overlay.edit-mode-active:active {
            cursor: grabbing;
        }

        /* スクロールする歌詞コンテナ */
        .subtitle-scroll-container {
            width: 100%;
            position: absolute;
            top: 50%;
            left: 0;
            text-align: center;
            transition: transform 0.5s ease-out;
        }

        /* 各歌詞の行スタイル */
        .subtitle-line {
            font-size: 1.2rem;
            font-weight: bold;
            color: #ffffff;
            margin: 1.2rem 0;
            opacity: 0.25;
            transition: all 0.3s ease;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.9), 0 0 10px rgba(0, 0, 0, 0.7);
            white-space: pre-wrap;
        }

        .subtitle-line.active {
            opacity: 1;
            color: var(--accent-color);
            font-size: 1.4rem;
            transform: scale(1.05);
        }

        .subtitle-line.nearby {
            opacity: 0.85;
            color: #ffffff;
            font-size: 1.25rem;
        }

        /* --- VTT編集モード専用の字幕文字サイズ設定 --- */
        .subtitle-overlay.edit-mode-active .subtitle-line {
            font-size: 0.9rem;  /* 通常行のサイズ */
        }
        .subtitle-overlay.edit-mode-active .subtitle-line.active {
            font-size: 1.1rem;  /* アクティブ（現在）行のサイズ */
        }
        .subtitle-overlay.edit-mode-active .subtitle-line.nearby {
            font-size: 0.95rem; /* 隣の行のサイズ */
        }

        /* --- 操作説明欄のスタイル --- */
        .vtt-help-panel {
            display: none;
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px dashed var(--border-color);
            border-radius: 6px;
            padding: 1.2rem;
            margin-top: 0.5rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .player-editor-wrapper.edit-mode .vtt-help-panel {
            display: block; /* 編集モード時のみ表示させる */
        }
        .vtt-help-panel ul {
            margin-top: 0.5rem;
            margin-left: 1.5rem;
        }
        .vtt-help-panel li {
            margin-bottom: 0.3rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>🎵 AI-Generated Music</h1>
    </header>

    <div class="main-container">
        <!-- 目次（サイドバー） -->
        <aside class="sidebar">
            <h2>曲目リスト</h2>
            <ul id="track-nav-list" class="track-nav">
                <!-- JavaScriptで自動生成されます -->
            </ul>
        </aside>

        <!-- メインウィンドウ -->
        <main id="content-area" class="content-area">
            <div id="loading" class="loading">楽曲データを読み込み中...</div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadSongsMarkdown('songs.md');
        });

        // マークダウンの読み込みと解析
        async function loadSongsMarkdown(filePath) {
            const contentArea = document.getElementById('content-area');
            try {
                const response = await fetch(filePath);
                if (!response.ok) {
                    throw new Error(`HTTP Error: ${response.status}`);
                }
                const mdText = await response.text();
                const songs = parseSongsMarkdown(mdText);

                if (songs.length === 0) {
                    contentArea.innerHTML = '<div class="error">曲データが見つかりませんでした。</div>';
                    return;
                }

                renderGallery(songs);
            } catch (err) {
                console.error(err);
                contentArea.innerHTML = `<div class="error">データの読み込みに失敗しました (${err.message})</div>`;
            }
        }

        // 簡易マークダウンパーサー
        function parseSongsMarkdown(mdText) {
            const rawBlocks = mdText.split(/^---$/m);
            const songs = [];

            rawBlocks.forEach(block => {
                const trimmed = block.trim();
                if (!trimmed) return;

                const titleMatch = trimmed.match(/^#\s+(.+)$/m);
                const title = titleMatch ? titleMatch[1].trim() : 'Untitled';

                const fileMatch = trimmed.match(/^[-*]?\s*File:\s*(.+)$/mi);
                const file = "media/" + (fileMatch ? fileMatch[1].trim() : '');

                let english = '';
                let japanese = '';

                const sections = trimmed.split(/^##\s+/m);
                sections.forEach(sec => {
                    const lines = sec.trim().split('\n');
                    const header = lines[0].toLowerCase().trim();
                    const body = lines.slice(1).join('\n').trim();

                    if (header.includes('english') || header.includes('英語')) {
                        english = body;
                    } else if (header.includes('japanese') || header.includes('日本語') || header.includes('訳')) {
                        japanese = body;
                    }
                });

                songs.push({ title, file, english, japanese });
            });

            return songs;
        }

        // HTML要素の動的生成
        function renderGallery(songs) {
            const navList = document.getElementById('track-nav-list');
            const contentArea = document.getElementById('content-area');

            navList.innerHTML = '';
            contentArea.innerHTML = '';

            songs.forEach((song, index) => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <button class="nav-btn ${index === 0 ? 'active' : ''}" onclick="switchTrack(${index}, event)">
                        ${index + 1}. ${escapeHtml(song.title)}
                    </button>
                `;
                navList.appendChild(li);

                const ext = song.file.split('.').pop().toLowerCase();
                const isVideo = ['mp4', 'webm', 'ogv', 'mov'].includes(ext);

                const mediaTag = isVideo
                    ? `<div class="edit-toggle-wrapper">
                         <label class="edit-toggle-label">
                           <input type="checkbox" id="edit-toggle-${index}"> 🛠️ VTT編集モード
                         </label>
                         <span class="time-display" id="time-display-${index}">現在の再生時間 00:00.000</span>
                       </div>
                       <div class="player-editor-wrapper" id="player-editor-${index}">
                         <div class="video-wrapper">
                           <video id="video-${index}" controls src="${escapeHtml(song.file)}"></video>
                           <div class="subtitle-overlay" id="overlay-${index}">
                             <div class="subtitle-scroll-container" id="sub-scroll-${index}"></div>
                           </div>
                         </div>
                         <div class="vtt-editor-panel" id="editor-panel-${index}">
                           <div class="editor-toolbar">
                             <button type="button" class="editor-btn" id="btn-copy-${index}">📋 コピー</button>
                             <button type="button" class="editor-btn" id="btn-download-${index}">💾 VTTダウンロード</button>
                           </div>
                           <textarea id="vtt-text-${index}" class="vtt-textarea" spellcheck="false" placeholder="WEBVTT..."></textarea>
                         </div>
                         <div class="vtt-help-panel">
                           【操作方法】
                           <ul>
                             <li>動画上の字幕をマウスで上下にスクロールさせることで字幕のタイミングを調整することができます。</li>
                             <li>テキストエリアでタイムスタンプや歌詞を直接書き換えることも可能です。</li>
                             <li>編集内容は保存されませんので、修正したVTTデータはダウンロードして別途アップロードしてください。</li>
                           </ul>
                         </div>
                       </div>`
                    : `<audio controls src="${escapeHtml(song.file)}"></audio>`;

                const article = document.createElement('article');
                article.id = `track-${index}`;
                article.className = `track-panel ${index === 0 ? 'active' : ''}`;
                article.innerHTML = `
                    <h2 class="track-title">${escapeHtml(song.title)}</h2>
                    
                    <div class="player-container">
                        ${mediaTag}
                    </div>

                    <div class="lyrics-section">
                        <h3>Lyrics & Translation</h3>
                        <div class="lyrics-grid">
                            <div class="lyrics-box">
                                <h4>English</h4>
                                <div class="lyrics-text">${escapeHtml(song.english)}</div>
                            </div>
                            <div class="lyrics-box">
                                <h4>日本語訳</h4>
                                <div class="lyrics-text">${escapeHtml(song.japanese)}</div>
                            </div>
                        </div>
                    </div>
                `;
                contentArea.appendChild(article);
            });

            // 動画プレイヤーごとの字幕・編集機能バインド
            songs.forEach((song, index) => {
                const video = document.getElementById(`video-${index}`);
                const scrollContainer = document.getElementById(`sub-scroll-${index}`);
                const overlay = document.getElementById(`overlay-${index}`);
                const editToggle = document.getElementById(`edit-toggle-${index}`);
                const editorWrapper = document.getElementById(`player-editor-${index}`);
                const textarea = document.getElementById(`vtt-text-${index}`);
                const timeDisplay = document.getElementById(`time-display-${index}`);
                const btnCopy = document.getElementById(`btn-copy-${index}`);
                const btnDownload = document.getElementById(`btn-download-${index}`);

                if (!video || !scrollContainer) return;

                const vttFile = song.file.replace(/\.[^/.]+$/, ".vtt");
                let cues = [];
                let isDragging = false;
                let dragStartY = 0;
                let initialTranslateY = 0;
                let currentTranslateY = 0;
                let lastTime = 0;
                let activeIndex = -1;

                // サーバーからVTTファイルをロードする関数
                function loadServerVTT(callback) {
                    fetch(vttFile)
                        .then(res => res.text())
                        .then(vttText => {
                            cues = parseVTT(vttText);
                            renderSubtitles();
                            if (callback) callback(vttText);
                        })
                        .catch(err => {
                            console.log('VTT字幕なし、または読み込み失敗:', err);
                            cues = [];
                            renderSubtitles();
                            if (callback) callback("WEBVTT\n\n");
                        });
                }

                // 初期読み込み
                loadServerVTT((vttText) => {
                    if (textarea) textarea.value = vttText;
                });

                // 字幕行エレメントの再生成
                function renderSubtitles() {
                    scrollContainer.innerHTML = cues.map((cue, i) => 
                        `<div class="subtitle-line" id="cue-${index}-${i}">${escapeHtml(cue.text)}</div>`
                    ).join('');
                }

                // スクロール位置とハイライト更新
                function updateScroll(idx, targetTranslateY = null) {
                    activeIndex = idx;
                    const lines = scrollContainer.querySelectorAll('.subtitle-line');
                    lines.forEach((line, i) => {
                        line.classList.remove('active', 'nearby');
                        if (i === activeIndex) {
                            line.classList.add('active');
                        } else if (Math.abs(i - activeIndex) === 1) {
                            line.classList.add('nearby');
                        }
                    });

                    if (targetTranslateY !== null) {
                        scrollContainer.style.transform = `translateY(${targetTranslateY}px)`;
                    } else {
                        const activeLine = lines[activeIndex !== -1 ? activeIndex : 0];
                        if (activeLine) {
                            const translateY = -(activeLine.offsetTop + activeLine.clientHeight / 2);
                            scrollContainer.style.transform = `translateY(${translateY}px)`;
                        }
                    }

                    // VTT編集モード時、<textarea> の自動スクロール処理
                    if (editToggle && editToggle.checked && activeIndex !== -1 && document.activeElement !== textarea) {
                        scrollToTextareaCue(activeIndex);
                    }
                }

                // 時間に基づくハイライトスクロール
                function updateScrollForTime(currentTime) {
                    if (cues.length > 0) {
                        const firstCueStart = cues[0].start;
                        const lastCueEnd = cues[cues.length - 1].end;
                        const showTime = Math.max(0, firstCueStart - 2);
                        const hideTime = lastCueEnd + 1;

                        if (currentTime >= showTime && currentTime <= hideTime && !video.ended) {
                            overlay.classList.add('visible');
                        } else {
                            overlay.classList.remove('visible');
                        }
                    }

                    let idx = cues.findIndex(c => currentTime >= c.start && currentTime <= c.end);
                    if (idx === -1) {
                        idx = cues.findLastIndex(c => currentTime >= c.start);
                    }
                    if (idx !== -1) {
                        updateScroll(idx);
                    }
                }

                // <textarea> 内のアクティブCueへスクロールさせる処理
                function scrollToTextareaCue(cueIndex) {
                    const text = textarea.value;
                    const lines = text.split('\n');
                    let currentCueCount = -1;
                    let targetLineIndex = -1;

                    for (let i = 0; i < lines.length; i++) {
                        if (lines[i].includes('-->')) {
                            currentCueCount++;
                            if (currentCueCount === cueIndex) {
                                targetLineIndex = i;
                                break;
                            }
                        }
                    }

                    if (targetLineIndex !== -1) {
                        const lineHeight = 20; // CSSで固定した line-height: 20px
                        const targetScrollTop = (targetLineIndex * lineHeight) - (textarea.clientHeight / 2) + lineHeight;
                        textarea.scrollTop = Math.max(0, targetScrollTop);
                    }
                }

                // 編集モードON/OFF切り替え（確認ダイアログと状態リセット付き）
                if (editToggle) {
                    editToggle.addEventListener('click', (e) => {
                        if (!editToggle.checked) {
                            // オフにしようとした場合、確認ダイアログを表示
                            const confirmDiscard = confirm("VTT編集モードを終了しますか？\n編集中の内容は保存されません。必要に応じて「VTTダウンロード」で保存してください。");
                            if (!confirmDiscard) {
                                e.preventDefault(); // チェック解除をキャンセル
                                return;
                            }

                            // OKの場合：textareaを消去し、サーバー上のVTTを再読み込みしてリセット
                            textarea.value = '';
                            editorWrapper.classList.remove('edit-mode');
                            overlay.classList.remove('edit-mode-active');
                            timeDisplay.style.display = 'none';

                            loadServerVTT(() => {
                                updateScrollForTime(video.currentTime);
                            });
                        } else {
                            // オンにする場合：サーバーから最新のVTTを読み込んで初期化
                            editorWrapper.classList.add('edit-mode');
                            overlay.classList.add('edit-mode-active', 'visible');
                            timeDisplay.style.display = 'inline-block';

                            loadServerVTT((vttText) => {
                                textarea.value = vttText;
                                updateScrollForTime(video.currentTime);
                            });
                        }
                    });
                }

                // 再生時間の監視とリアルタイムタイム表示の更新
                video.addEventListener('timeupdate', () => {
                    const currentTime = video.currentTime;

                    if (timeDisplay) {
                        timeDisplay.textContent = '現在の再生時間 ' + formatTime(currentTime);
                    }

                    if (isDragging) return; // ドラッグ中は自動スクロール停止

                    if (Math.abs(currentTime - lastTime) > 1.0) {
                        scrollContainer.style.transition = 'none';
                    } else {
                        scrollContainer.style.transition = '';
                    }
                    lastTime = currentTime;

                    updateScrollForTime(currentTime);
                });

                // 動画終了時
                video.addEventListener('ended', () => {
                    if (editToggle && editToggle.checked) return;
                    overlay.classList.remove('visible');
                    setTimeout(() => {
                        if (video.paused) {
                            scrollContainer.style.transition = 'none';
                            updateScroll(-1);
                            scrollContainer.offsetHeight;
                            scrollContainer.style.transition = '';
                        }
                    }, 600);
                });

                // --- ドラッグ＆ドロップによる字幕スクロールとタイムスタンプ連動 ---
                overlay.addEventListener('pointerdown', (e) => {
                    if (!editToggle || !editToggle.checked) return;

                    isDragging = true;
                    dragStartY = e.clientY;

                    const style = window.getComputedStyle(scrollContainer);
                    const matrix = new WebKitCSSMatrix(style.transform);
                    initialTranslateY = matrix.m42;
                    currentTranslateY = initialTranslateY;

                    scrollContainer.style.transition = 'none';
                    overlay.setPointerCapture(e.pointerId);
                });

                overlay.addEventListener('pointermove', (e) => {
                    if (!isDragging) return;

                    const deltaY = e.clientY - dragStartY;
                    currentTranslateY = initialTranslateY + deltaY;

                    const lines = scrollContainer.querySelectorAll('.subtitle-line');
                    let newActiveIndex = -1;
                    let minDiff = Infinity;

                    lines.forEach((line, i) => {
                        const lineCenter = line.offsetTop + line.offsetHeight / 2;
                        const diff = Math.abs(lineCenter - (-currentTranslateY));
                        if (diff < minDiff) {
                            minDiff = diff;
                            newActiveIndex = i;
                        }
                    });

                    updateScroll(newActiveIndex, currentTranslateY);

                    // タイムスタンプ調整ロジック（玉突き含む）
                    if (newActiveIndex !== -1 && cues[newActiveIndex]) {
                        const now = video.currentTime;
                        const cue = cues[newActiveIndex];
                        let changed = false;

                        if (now < cue.start) {
                            cue.start = now;
                            if (cue.start >= cue.end - cue.minDuration) {
                                cue.end = cue.start + cue.minDuration;
                                adjustNext(newActiveIndex);
                            }
                            adjustPrevious(newActiveIndex);
                            changed = true;
                        } else if (now > cue.end) {
                            cue.end = now;
                            if (cue.end <= cue.start + cue.minDuration) {
                                cue.start = Math.max(0, cue.end - cue.minDuration);
                                adjustPrevious(newActiveIndex);
                            }
                            adjustNext(newActiveIndex);
                            changed = true;
                        }

                        if (changed) {
                            textarea.value = generateVTT(cues);
                        }
                    }
                });

                const endDrag = (e) => {
                    if (!isDragging) return;
                    isDragging = false;
                    try { overlay.releasePointerCapture(e.pointerId); } catch(err) {}
                    scrollContainer.style.transition = '';
                    updateScrollForTime(video.currentTime);
                };

                overlay.addEventListener('pointerup', endDrag);
                overlay.addEventListener('pointercancel', endDrag);

                // 前の行への玉突き（押しつぶし）処理
                function adjustPrevious(idx) {
                    if (idx <= 0) return;
                    const curr = cues[idx];
                    const prev = cues[idx - 1];

                    if (prev.end > curr.start) {
                        prev.end = curr.start;
                        if (prev.end - prev.start < prev.minDuration) {
                            prev.start = prev.end - prev.minDuration;
                            if (prev.start < 0) {
                                prev.start = 0;
                                prev.end = Math.min(curr.start, prev.minDuration);
                            }
                            adjustPrevious(idx - 1);
                        }
                    }
                }

                // 次の行への玉突き（押しつぶし）処理
                function adjustNext(idx) {
                    if (idx >= cues.length - 1) return;
                    const curr = cues[idx];
                    const next = cues[idx + 1];

                    if (next.start < curr.end) {
                        next.start = curr.end;
                        if (next.end - next.start < next.minDuration) {
                            next.end = next.start + next.minDuration;
                            if (video.duration && next.end > video.duration) {
                                next.end = video.duration;
                                next.start = Math.max(curr.end, next.end - next.minDuration);
                            }
                            adjustNext(idx + 1);
                        }
                    }
                }

                // --- Textarea 手動編集イベント ---
                textarea.addEventListener('focus', () => {
                    video.pause();
                });

                textarea.addEventListener('input', () => {
                    cues = parseVTT(textarea.value);
                    renderSubtitles();
                    updateScrollForTime(video.currentTime);
                });

                // コピーボタン
                btnCopy.addEventListener('click', () => {
                    navigator.clipboard.writeText(textarea.value).then(() => {
                        const origText = btnCopy.textContent;
                        btnCopy.textContent = '✅ コピー完了';
                        setTimeout(() => btnCopy.textContent = origText, 1500);
                    });
                });

                // ダウンロードボタン
                btnDownload.addEventListener('click', () => {
                    const blob = new Blob([textarea.value], { type: 'text/vtt;charset=utf-8;' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = song.file.replace(/^.*[\\/]/, '').replace(/\.[^/.]+$/, "") + '.vtt';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                });
            });

            // VTTテキスト解析パーサー
            function parseVTT(vttText) {
                const lines = vttText.split(/\r?\n/);
                const cues = [];
                let currentCue = null;

                lines.forEach(line => {
                    line = line.trim();
                    if (line.includes('-->')) {
                        if (currentCue) cues.push(currentCue);
                        const times = line.split('-->');
                        const start = parseTimeToSeconds(times[0].trim());
                        const end = parseTimeToSeconds(times[1].trim());
                        const origDur = end - start;
                        currentCue = {
                            start: start,
                            end: end,
                            minDuration: origDur < 1.0 ? origDur : 1.0,
                            text: ''
                        };
                    } else if (line === '' && currentCue) {
                        cues.push(currentCue);
                        currentCue = null;
                    } else if (currentCue && !line.startsWith('WEBVTT') && !line.match(/^\d+$/)) {
                        currentCue.text += (currentCue.text ? '\n' : '') + line;
                    }
                });
                if (currentCue) cues.push(currentCue);
                return cues;
            }

            // cues 配列から WEBVTT テキスト文字列を生成
            function generateVTT(cues) {
                let text = "WEBVTT\n\n";
                cues.forEach(cue => {
                    text += `${formatTime(cue.start)} --> ${formatTime(cue.end)}\n`;
                    text += `${cue.text}\n\n`;
                });
                return text.trim() + "\n";
            }

            // 秒数を 00:00.000 形式に変換
            function formatTime(sec) {
                if (isNaN(sec) || sec < 0) sec = 0;
                const hrs = Math.floor(sec / 3600);
                const mins = Math.floor((sec % 3600) / 60);
                const secs = sec % 60;
                const s = Math.floor(secs);
                const ms = Math.floor((secs - s) * 1000);

                const pad = (num, size = 2) => String(num).padStart(size, '0');
                if (hrs > 0) {
                    return `${pad(hrs)}:${pad(mins)}:${pad(s)}.${pad(ms, 3)}`;
                } else {
                    return `${pad(mins)}:${pad(s)}.${pad(ms, 3)}`;
                }
            }

            // 時間文字列を秒数に変換
            function parseTimeToSeconds(timeStr) {
                if (!timeStr) return 0;
                const parts = timeStr.split(':');
                let seconds = 0;
                if (parts.length === 3) {
                    seconds += parseFloat(parts[0]) * 3600;
                    seconds += parseFloat(parts[1]) * 60;
                    seconds += parseFloat(parts[2]);
                } else if (parts.length === 2) {
                    seconds += parseFloat(parts[0]) * 60;
                    seconds += parseFloat(parts[1]);
                }
                return seconds;
            }
        }

        // タブ切り替え処理
        function switchTrack(index, event) {
            const panels = document.querySelectorAll('.track-panel');
            panels.forEach(p => p.classList.remove('active'));
            const targetPanel = document.getElementById(`track-${index}`);
            if (targetPanel) targetPanel.classList.add('active');

            const buttons = document.querySelectorAll('.nav-btn');
            buttons.forEach(b => b.classList.remove('active'));
            event.currentTarget.classList.add('active');

            const mediaElements = document.querySelectorAll('audio, video');
            mediaElements.forEach(media => media.pause());
        }

        // XSS対策用エスケープ
        function escapeHtml(str) {
            if (!str) return '';
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
</body>
</html>
