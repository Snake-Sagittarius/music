<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-Generated Music</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 1.5rem 2rem;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            text-align: center;
        }

        header h1 {
            font-size: 1.6rem;
            color: var(--accent-color);
            letter-spacing: 0.05em;
        }

        .main-container {
            display: flex;
            flex: 1;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            padding: 1.5rem;
            gap: 1.5rem;
        }

        /* サイドバー（目次） */
        .sidebar {
            width: 280px;
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 1rem;
            border: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .sidebar h2 {
            font-size: 1rem;
            margin-bottom: 1rem;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
        }

        .track-nav {
            list-style: none;
        }

        .track-nav li {
            margin-bottom: 0.5rem;
        }

        .track-nav li button {
            width: 100%;
            text-align: left;
            padding: 0.75rem 1rem;
            background: none;
            border: 1px solid transparent;
            color: var(--text-color);
            font-size: 0.95rem;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .track-nav li button:hover {
            background-color: rgba(56, 189, 248, 0.1);
            color: var(--accent-color);
        }

        .track-nav li button.active {
            background-color: var(--accent-color);
            color: #0f172a;
            font-weight: bold;
        }

        /* メインコンテンツ表示領域 */
        .content-area {
            flex: 1;
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 2rem;
            border: 1px solid var(--border-color);
        }

        .track-panel {
            display: none;
        }

        .track-panel.active {
            display: block;
        }

        .track-title {
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
            color: var(--accent-color);
        }

        /* プレイヤーエリア */
        .player-container {
            margin-bottom: 2rem;
            background: rgba(0, 0, 0, 0.25);
            padding: 1.25rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        audio, video {
            width: 100%;
            border-radius: 4px;
            outline: none;
        }

        /* 歌詞セクション */
        .lyrics-section h3 {
            font-size: 1.1rem;
            margin-bottom: 1rem;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
        }

        .lyrics-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
        }

        .lyrics-box {
            background: rgba(0, 0, 0, 0.15);
            padding: 1.25rem;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            font-size: 0.95rem;
            line-height: 1.8;
            width: calc(50% - 0.75rem);
            min-width: 300px;    /* 縮めた時にこれ以上狭くならない最低幅 */
            overflow: auto;      /* resizeを有効にするための必須プロパティ */
            resize: horizontal;  /* 右下のつまみで横方向の手動リサイズを可能に */
        }

        .lyrics-text {
            white-space: pre-wrap;
        }

        .lyrics-box h4 {
            font-size: 0.85rem;
            color: var(--accent-color);
            margin-bottom: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .loading, .error {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
        }

        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
            }
            .lyrics-grid {
                grid-template-columns: 1fr;
            }
        }

        /* 動画と字幕オーバーレイを包む枠 */
        .video-wrapper {
            position: relative;
            width: 100%;
            border-radius: 4px;
            overflow: hidden;
            background: #000;
        }

        /* 動画の上に被せる全画面字幕エリア */
        .subtitle-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* 動画のクリック・再生操作を妨げない設定 */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.3); /* 動画が見やすいように少し暗くする */
        }

        /* スクロールする歌詞コンテナ */
        .subtitle-scroll-container {
            width: 90%;
            text-align: center;
            transition: transform 0.5s ease-out; /* スクロールの動きを滑らかに */
        }

        /* 各歌詞の行スタイル */
        .subtitle-line {
            font-size: 1.2rem;
            font-weight: bold;
            color: #ffffff;
            margin: 1.2rem 0;
            opacity: 0.3; /* 非アクティブな行は半透明 */
            transition: all 0.3s ease;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.9), 0 0 10px rgba(0, 0, 0, 0.7);
        }

        /* 現在再生中の歌詞行のハイライト */
        .subtitle-line.active {
            opacity: 1;
            color: var(--accent-color); /* アクティブな歌詞の色 */
            font-size: 1.4rem;
            transform: scale(1.05);
        }

        /* ブラウザ標準の字幕表示を非表示化 */
        video::cue {
            background: transparent;
            color: transparent;
        }

    </style>
</head>
<body>

    <header>
        <h1>🎵 AI-Generated Music</h1>
    </header>

    <div class="main-container">
        <!-- 目次（サイドバー） -->
        <aside class="sidebar">
            <h2>曲目リスト</h2>
            <ul id="track-nav-list" class="track-nav">
                <!-- JavaScriptで自動生成されます -->
            </ul>
        </aside>

        <!-- メインウィンドウ -->
        <main id="content-area" class="content-area">
            <div id="loading" class="loading">楽曲データを読み込み中...</div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadSongsMarkdown('songs.md');
        });

        // マークダウンの読み込みと解析
        async function loadSongsMarkdown(filePath) {
            const contentArea = document.getElementById('content-area');
            try {
                const response = await fetch(filePath);
                if (!response.ok) {
                    throw new Error(`HTTP Error: ${response.status}`);
                }
                const mdText = await response.text();
                const songs = parseSongsMarkdown(mdText);

                if (songs.length === 0) {
                    contentArea.innerHTML = '<div class="error">曲データが見つかりませんでした。</div>';
                    return;
                }

                renderGallery(songs);
            } catch (err) {
                console.error(err);
                contentArea.innerHTML = `<div class="error">データの読み込みに失敗しました (${err.message})</div>`;
            }
        }

        // 簡易マークダウンパーサー
        function parseSongsMarkdown(mdText) {
            // "---" で各曲ブロックに分割
            const rawBlocks = mdText.split(/^---$/m);
            const songs = [];

            rawBlocks.forEach(block => {
                const trimmed = block.trim();
                if (!trimmed) return;

                // 曲タイトル (# タイトル)
                const titleMatch = trimmed.match(/^#\s+(.+)$/m);
                const title = titleMatch ? titleMatch[1].trim() : 'Untitled';

                // メディアファイルパス (- File: xxx)
                const fileMatch = trimmed.match(/^[-*]?\s*File:\s*(.+)$/mi);
                const file =  "media/" + (fileMatch ? fileMatch[1].trim() : '');

                // 英語・日本語歌詞の抽出 (## English / ## Japanese)
                let english = '';
                let japanese = '';

                const sections = trimmed.split(/^##\s+/m);
                sections.forEach(sec => {
                    const lines = sec.trim().split('\n');
                    const header = lines[0].toLowerCase().trim();
                    const body = lines.slice(1).join('\n').trim();

                    if (header.includes('english') || header.includes('英語')) {
                        english = body;
                    } else if (header.includes('japanese') || header.includes('日本語') || header.includes('訳')) {
                        japanese = body;
                    }
                });

                songs.push({ title, file, english, japanese });
            });

            return songs;
        }

        // HTML要素の動的生成
        function renderGallery(songs) {
            const navList = document.getElementById('track-nav-list');
            const contentArea = document.getElementById('content-area');

            navList.innerHTML = '';
            contentArea.innerHTML = '';

            songs.forEach((song, index) => {
                // ナビゲーションボタン生成
                const li = document.createElement('li');
                li.innerHTML = `
                    <button class="nav-btn ${index === 0 ? 'active' : ''}" onclick="switchTrack(${index}, event)">
                        ${index + 1}. ${escapeHtml(song.title)}
                    </button>
                `;
                navList.appendChild(li);

                // メディアタイプの自動判定（動画か音声か）
                // 動画の場合字幕表示に必要なタグを追加
                const ext = song.file.split('.').pop().toLowerCase();
                const isVideo = ['mp4', 'webm', 'ogv', 'mov'].includes(ext);
                const vttFile = song.file.replace(/\.[^/.]+$/, ".vtt");
                const mediaTag = isVideo
                    ? `<div class="video-wrapper">
                         <video id="video-${index}" controls src="${escapeHtml(song.file)}">
                           <track kind="subtitles" src="${escapeHtml(vttFile)}" srclang="en" label="English" default>
                         </video>
                         <div class="subtitle-overlay">
                           <div class="subtitle-scroll-container" id="sub-scroll-${index}"></div>
                         </div>
                       </div>`
                    : `<audio controls src="${escapeHtml(song.file)}"></audio>`;

                // コンテンツパネル生成
                const article = document.createElement('article');
                article.id = `track-${index}`;
                article.className = `track-panel ${index === 0 ? 'active' : ''}`;
                article.innerHTML = `
                    <h2 class="track-title">${escapeHtml(song.title)}</h2>
                    
                    <div class="player-container">
                        ${mediaTag}
                    </div>

                    <div class="lyrics-section">
                        <h3>Lyrics & Translation</h3>
                        <div class="lyrics-grid">
                            <div class="lyrics-box">
                                <h4>English</h4>
                                <div class="lyrics-text">${escapeHtml(song.english)}</div>
                            </div>
                            <div class="lyrics-box">
                                <h4>日本語訳</h4>
                                <div class="lyrics-text">${escapeHtml(song.japanese)}</div>
                            </div>
                        </div>
                    </div>
                `;
                contentArea.appendChild(article);
            });

            // HTML生成後に各動画へスクロール字幕機能をバインド
            songs.forEach((song, index) => {
                const video = document.getElementById(`video-${index}`);
                const scrollContainer = document.getElementById(`sub-scroll-${index}`);
                if (!video || !scrollContainer) return;

                const vttFile = song.file.replace(/\.[^/.]+$/, ".vtt");

                // VTTファイルをfetchしてパース（解析）
                fetch(vttFile)
                    .then(res => res.text())
                    .then(vttText => {
                        const cues = parseVTT(vttText);
                        
                        // 画面上に歌詞の行要素を生成
                        scrollContainer.innerHTML = cues.map((cue, i) => 
                            `<div class="subtitle-line" id="cue-${index}-${i}">${escapeHtml(cue.text)}</div>`
                        ).join('');

                        // 再生時間更新イベントの監視
                        video.addEventListener('timeupdate', () => {
                            const currentTime = video.currentTime;
                            let activeIndex = cues.findIndex(c => currentTime >= c.start && currentTime <= c.end);

                            // 該当する行がない場合、直前の行を基準にする
                            if (activeIndex === -1) {
                                activeIndex = cues.findLastIndex(c => currentTime >= c.start);
                            }

                            // スタイル更新とスクロール処理
                            const lines = scrollContainer.querySelectorAll('.subtitle-line');
                            lines.forEach((line, i) => {
                                if (i === activeIndex) {
                                    line.classList.add('active');
                                } else {
                                    line.classList.remove('active');
                                }
                            });

                            if (activeIndex !== -1 && lines[activeIndex]) {
                                // アクティブな行がオーバーレイの上下中央に来るようY軸オフセットを計算
                                const activeLine = lines[activeIndex];
                                const containerHeight = scrollContainer.parentElement.clientHeight;
                                const lineOffsetTop = activeLine.offsetTop;
                                const lineHeight = activeLine.clientHeight;

                                const translateY = (containerHeight / 2) - (lineOffsetTop + lineHeight / 2);
                                scrollContainer.style.transform = `translateY(${translateY}px)`;
                            }
                        });
                    })
                    .catch(err => console.log('VTT字幕なし、または読み込み失敗:', err));
            });

            // 簡易VTTパーサー関数
            function parseVTT(vttText) {
                const lines = vttText.split(/\r?\n/);
                const cues = [];
                let currentCue = null;

                const timeReg = /(\d{2}:)?\d{2}:\d{2}\.\d{3}/;

                lines.forEach(line => {
                    line = line.trim();
                    if (line.includes('-->')) {
                        const times = line.split('-->');
                        currentCue = {
                            start: parseTimeToSeconds(times[0].trim()),
                            end: parseTimeToSeconds(times[1].trim()),
                            text: ''
                        };
                    } else if (currentCue && line !== '' && !line.startsWith('WEBVTT')) {
                        currentCue.text += (currentCue.text ? '\n' : '') + line;
                        cues.push(currentCue);
                        currentCue = null;
                    }
                });
                return cues;
            }

            // 時間表記 (00:01:20.500) を秒数 (80.5) に変換する関数
            function parseTimeToSeconds(timeStr) {
                const parts = timeStr.split(':');
                let seconds = 0;
                if (parts.length === 3) {
                    seconds += parseFloat(parts[0]) * 3600;
                    seconds += parseFloat(parts[1]) * 60;
                    seconds += parseFloat(parts[2]);
                } else if (parts.length === 2) {
                    seconds += parseFloat(parts[0]) * 60;
                    seconds += parseFloat(parts[2]);
                }
                return seconds;
            }
        }

        // タブ切り替え処理
        function switchTrack(index, event) {
            // パネル切り替え
            const panels = document.querySelectorAll('.track-panel');
            panels.forEach(p => p.classList.remove('active'));
            const targetPanel = document.getElementById(`track-${index}`);
            if (targetPanel) targetPanel.classList.add('active');

            // ボタン表示切り替え
            const buttons = document.querySelectorAll('.nav-btn');
            buttons.forEach(b => b.classList.remove('active'));
            event.currentTarget.classList.add('active');

            // 再生中の音声を停止
            const mediaElements = document.querySelectorAll('audio, video');
            mediaElements.forEach(media => media.pause());
        }

        // XSS対策用エスケープ
        function escapeHtml(str) {
            if (!str) return '';
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
</body>
</html>
